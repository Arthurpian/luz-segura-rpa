[pytest]
testpaths = tests
pythonpath = src tests
markers =
    sucesso: caminho feliz de ponta a ponta
    decisao: regras de decisão e repetição (gateways do BPMN)
    falha: exceções, serviços fora do ar e recuperação
    lgpd: proteção de dados pessoais e segurança
    integracao: consumo do resultado pelo MVP (API, banco, arquivos)
filterwarnings =
    ignore:Using .httpx. with .starlette.testclient. is deprecated
